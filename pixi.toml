[workspace]
authors = ["Tyler Jost <tjost@bwh.harvard.edu>"]
channels = ["conda-forge"]
name = "labLedger"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[activation]
scripts = ['load_keys.sh']
[tasks]

[dependencies]
pytorch-gpu = "*"
transformers = ">=4.56.2,<5"
sentence-transformers = ">=5.2.2,<6"

[pypi-dependencies]
ipykernel = "*"
textual = "*"
langchain = "*"
langchain-anthropic = "*"
langchain-community = "*"
langchain_huggingface = "*"
langchain_chroma = "*"
GitPython = "*"
